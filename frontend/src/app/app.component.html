<div class="min-h-screen bg-slate-100">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-5">
      <h1 class="text-2xl font-bold text-slate-900">Speech to Text</h1>
      <p class="text-sm text-slate-500">Real-time multilingual transcription powered by Gemini Live</p>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 px-4 py-6 lg:grid-cols-5">
    <div class="lg:col-span-2">
      <app-recorder (saved)="history.load()" />
    </div>
    <div class="lg:col-span-3">
      <app-history #history />
    </div>
  </main>
</div>
